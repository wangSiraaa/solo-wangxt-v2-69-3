# 测试环境：H2 内存库（主环境使用 PostgreSQL）
spring:
  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

logging:
  level:
    org.hibernate.orm.deprecation: ERROR
