<header class="topbar">
  <div>
    <h1>还款方案工作台</h1>
    <p>
      提前还款对比：对同一笔提前还款生成「缩短期限」与「降低月供」两种计划；
      宽限与延期模拟：配置不重叠的宽限区间（只还利息 / 暂停并资本化 / 暂停后一次性补缴），
      对比原方案与延期方案。全部使用模拟合同，不连接真实放贷接口。
    </p>
  </div>
</header>

<nav class="tabs">
  <button type="button" [class.active]="tab === 'prepay'" (click)="tab = 'prepay'">提前还款对比</button>
  <button type="button" [class.active]="tab === 'deferral'" (click)="tab = 'deferral'">宽限与延期模拟</button>
</nav>

<main class="container" *ngIf="tab === 'prepay'">
  <app-compare-form [loading]="loading" (submitted)="onSubmit($event)" />

  <div class="error-banner" *ngIf="error">{{ error }}</div>

  <ng-container *ngIf="comparison">
    <p class="record-note" *ngIf="recordId != null">当前展示：计算记录 #{{ recordId }}</p>
    <app-plan-result [result]="comparison" [method]="method" />
  </ng-container>

  <app-history [refreshToken]="historyRefresh" (viewRecord)="onViewRecord($event)" />
</main>

<main class="container" *ngIf="tab === 'deferral'">
  <app-deferral-form [loading]="deferralLoading" (submitted)="onDeferralSubmit($event)" />

  <div class="error-banner" *ngIf="deferralError">{{ deferralError }}</div>

  <ng-container *ngIf="deferralResult">
    <p class="record-note" *ngIf="deferralResult.recordId != null">
      当前展示：延期模拟记录 #{{ deferralResult.recordId }}
      <ng-container *ngIf="deferralResult.policyName">（政策快照：{{ deferralResult.policyName }}）</ng-container>
    </p>
    <app-deferral-result
      [result]="deferralResult.comparison"
      [method]="deferralResult.method"
      [intervals]="deferralResult.intervals"
    />
  </ng-container>

  <app-deferral-history [refreshToken]="deferralHistoryRefresh" (viewRecord)="onViewDeferralRecord($event)" />
</main>
